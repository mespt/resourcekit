<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>MESPT Resource Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1d4ed8; --blue-dark:#1e3a8a; --blue-soft:#eff4ff; --line:#d6e0fa;
  --ink:#0f1e4a; --muted:#4a5a85; --white:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--white);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.55}
.hero{background:var(--blue);color:#fff;padding:48px 20px 56px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-90px;bottom:-110px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.09)}
.wrap{max-width:760px;margin:0 auto;position:relative;z-index:1}
.brand{font-family:Sora,sans-serif;font-weight:700;font-size:15px;letter-spacing:.04em;opacity:.9;margin:0 0 18px}
h1{font-family:Sora,sans-serif;font-weight:800;font-size:clamp(34px,8vw,56px);line-height:1.05;margin:0 0 14px}
.hero p{margin:0;max-width:46ch;font-size:17px;color:#dbe6ff}
main{max-width:760px;margin:-28px auto 0;padding:0 16px 40px;position:relative;z-index:2}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px rgba(29,78,216,.08)}
.card h2{font-family:Sora,sans-serif;font-size:18px;line-height:1.3;margin:0 0 4px}
.card p{margin:0 0 14px;color:var(--muted);font-size:14.5px}
.tag{display:inline-block;background:var(--blue-soft);color:var(--blue-dark);font-weight:600;font-size:12px;padding:2px 9px;border-radius:99px;margin-bottom:8px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{appearance:none;border:1.5px solid var(--blue);background:#fff;color:var(--blue);font:600 15px Inter,sans-serif;padding:11px 18px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.btn.primary{background:var(--blue);color:#fff}
.btn:hover{background:var(--blue-dark);border-color:var(--blue-dark);color:#fff}
.btn:focus-visible{outline:3px solid #93b4ff;outline-offset:2px}
.btn svg{width:18px;height:18px;flex:none}
footer{text-align:center;color:var(--muted);font-size:13px;padding:8px 16px 28px}
/* viewer */
.viewer{position:fixed;inset:0;background:#fff;z-index:50;display:none;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.viewer.open{display:flex}
.vbar{display:flex;align-items:center;gap:10px;background:var(--blue);color:#fff;padding:10px 12px}
.vbar h3{flex:1;margin:0;font:700 15px Sora,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbar .btn{background:#fff;color:var(--blue);border-color:#fff;padding:8px 14px;min-height:40px}
.vbar .btn:hover{background:var(--blue-soft);color:var(--blue-dark);border-color:var(--blue-soft)}
.vbody{flex:1;position:relative;background:var(--blue-soft)}
.vbody iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.vnote{padding:8px 14px;font-size:13px;color:var(--muted);background:#fff;border-top:1px solid var(--line);text-align:center}
.vnote a{color:var(--blue);font-weight:600}
@media (max-width:480px){.btn .lbl-long{display:none}.vbar .btn span.t{display:none}}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <p class="brand">MESPT</p>
    <h1>MESPT Resource Kit</h1>
    <p>Read each document here on the page, or download a copy to keep.</p>
  </div>
</header>

<main id="list"></main>
<footer>© MESPT</footer>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Document viewer">
  <div class="vbar">
    <button class="btn" id="close" type="button" aria-label="Close viewer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg><span class="t">Back</span>
    </button>
    <h3 id="vtitle"></h3>
    <a class="btn" id="vdl" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg><span class="t">Download</span>
    </a>
  </div>
  <div class="vbody"><iframe id="frame" title="Document" allow="fullscreen"></iframe></div>
  <div class="vnote">Document not loading? <a id="vopen" href="#" target="_blank" rel="noopener">Open it in Google Drive</a></div>
</div>

<script>
var DOCS=[
 {id:"1cdH1-1SJA2LSjtT-AZxcb69fJO1iwr8y",title:"Endline Validation Workshop – GEAP",file:"ENDLINE VALIDATION WORKSHOP GEAP.pdf",desc:"Findings and outcomes from the GEAP endline validation workshop.",tag:"Workshop report"},
 {id:"1D7_xONPtprUm7da9GxI-BXb5rXZ31vxs",title:"MESPT Popular Version",file:"Final MESPT_Popular Version.pdf",desc:"The popular, easy-to-read version of the MESPT story.",tag:"Popular version"},
 {id:"1BAJ3nvJ2mwuZ1pIOL_OMJ-NKY0HZfkGS",title:"MESPT Annual Report 2025",file:"MESPT_Annual Report 2025_WEB.pdf",desc:"Results, highlights and financials for the year 2025.",tag:"Annual report"}
];
var icoEye='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
var icoDl='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>';
function dl(d){return "https://drive.google.com/uc?export=download&id="+d.id}
function pv(d){return "https://drive.google.com/file/d/"+d.id+"/preview"}
function view(d){return "https://drive.google.com/file/d/"+d.id+"/view"}

var list=document.getElementById("list");
DOCS.forEach(function(d,i){
  var c=document.createElement("section");c.className="card";
  c.innerHTML='<span class="tag">'+d.tag+'</span><h2>'+d.title+'</h2><p>'+d.desc+'</p>'+
   '<div class="row"><button class="btn primary" type="button" data-i="'+i+'">'+icoEye+'Read here</button>'+
   '<a class="btn" href="'+dl(d)+'" target="_blank" rel="noopener">'+icoDl+'Download PDF</a></div>';
  list.appendChild(c);
});

var viewer=document.getElementById("viewer"),frame=document.getElementById("frame");
function openDoc(i){
  var d=DOCS[i];
  document.getElementById("vtitle").textContent=d.title;
  document.getElementById("vdl").href=dl(d);
  document.getElementById("vopen").href=view(d);
  frame.src=pv(d);
  viewer.classList.add("open");document.body.style.overflow="hidden";
  document.getElementById("close").focus();
}
function closeDoc(){viewer.classList.remove("open");frame.src="about:blank";document.body.style.overflow=""}
list.addEventListener("click",function(e){var b=e.target.closest("button[data-i]");if(b)openDoc(+b.dataset.i)});
document.getElementById("close").addEventListener("click",closeDoc);
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&viewer.classList.contains("open"))closeDoc()});
</script>
</body>
</html>
